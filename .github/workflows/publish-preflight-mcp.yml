name: Publish Preflight to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "preflight-v*"

# Least privilege at the workflow level; the publish job widens only to the
# id-token needed for MCP Registry GitHub-OIDC auth.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MCP Registry github-oidc login
      contents: read    # checkout
    defaults:
      run:
        working-directory: products/preflight

    env:
      # Pinned, checksum-verified mcp-publisher (ADR-0050 §11: no `latest`, no
      # unverified download). Bump both together from the release's checksums
      # file: registry_<version>_checksums.txt.
      MCP_PUBLISHER_VERSION: "1.8.0"
      MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$url" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish
